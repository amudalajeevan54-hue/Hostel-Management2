<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUpdate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadowUpdate" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="480" height="200" rx="16" fill="url(#bgUpdate)" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Left: Original Room Record -->
  <g transform="translate(60, 40)" filter="url(#shadowUpdate)">
    <rect x="0" y="0" width="140" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="26" rx="8" fill="#64748b"/>
    <rect x="0" y="18" width="140" height="8" fill="#64748b"/>
    <text x="70" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CURRENT RECORD</text>

    <!-- Details -->
    <text x="14" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Room ID: 103</text>
    <line x1="14" y1="48" x2="126" y2="48" stroke="#e2e8f0"/>

    <text x="14" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Capacity: 4 Beds</text>
    <line x1="14" y1="68" x2="126" y2="68" stroke="#e2e8f0"/>

    <text x="14" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Occupied: 2</text>
    <line x1="14" y1="88" x2="126" y2="88" stroke="#e2e8f0"/>

    <rect x="14" y="102" width="112" height="18" rx="4" fill="#f1f5f9"/>
    <text x="70" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">Available: 2 Beds</text>
  </g>

  <!-- Center: Edit Action / Sync Pencil -->
  <g transform="translate(225, 80)">
    <circle cx="25" cy="25" r="22" fill="#2563eb" filter="url(#shadowUpdate)"/>
    <!-- Pencil / Edit Icon -->
    <path d="M 16 32 L 18 24 L 30 12 L 36 18 L 24 30 L 16 32 Z" fill="#ffffff"/>
    <line x1="28" y1="14" x2="34" y2="20" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Right: Modified / Updated Record -->
  <g transform="translate(300, 40)" filter="url(#shadowUpdate)">
    <rect x="0" y="0" width="140" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="26" rx="8" fill="#1e40af"/>
    <rect x="0" y="18" width="140" height="8" fill="#1e40af"/>
    <text x="70" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">UPDATED RECORD</text>

    <!-- Details with Highlights -->
    <text x="14" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#1e40af">Room ID: 103</text>
    <line x1="14" y1="48" x2="126" y2="48" stroke="#bfdbfe"/>

    <text x="14" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#1e40af">Capacity: 4 Beds</text>
    <line x1="14" y1="68" x2="126" y2="68" stroke="#bfdbfe"/>

    <text x="14" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#d97706">Occupied: 4 (Full)</text>
    <line x1="14" y1="88" x2="126" y2="88" stroke="#bfdbfe"/>

    <rect x="14" y="102" width="112" height="18" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="70" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">✓ Saved to MySQL</text>
  </g>
</svg>
