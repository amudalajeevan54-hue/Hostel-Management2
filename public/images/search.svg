<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSearch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadowSearch" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="480" height="200" rx="16" fill="url(#bgSearch)" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Left: Room Door with Room ID Plaque -->
  <g transform="translate(60, 35)" filter="url(#shadowSearch)">
    <!-- Door Frame -->
    <rect x="0" y="0" width="95" height="150" rx="6" fill="#1e293b"/>
    <rect x="6" y="6" width="83" height="144" rx="4" fill="#1e3a8a"/>

    <!-- Door Panels -->
    <rect x="14" y="16" width="67" height="42" rx="3" fill="#1d4ed8"/>
    <rect x="14" y="66" width="67" height="74" rx="3" fill="#1d4ed8"/>

    <!-- Room Number Plaque -->
    <rect x="24" y="24" width="47" height="24" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="47" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">ROOM</text>
    <text x="47" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#1e40af" text-anchor="middle">ID: 101</text>

    <!-- Door Handle -->
    <circle cx="73" cy="98" r="4.5" fill="#facc15"/>
    <rect x="71" y="98" width="8" height="3" rx="1.5" fill="#ca8a04"/>
  </g>

  <!-- Center: Magnifying Glass inspecting Room Record Card -->
  <g transform="translate(195, 30)" filter="url(#shadowSearch)">
    <!-- Room Detail Card -->
    <rect x="0" y="15" width="160" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="15" width="160" height="28" rx="8" fill="#1e40af"/>
    <!-- Remove bottom rounded corners of header -->
    <rect x="0" y="35" width="160" height="8" fill="#1e40af"/>
    <text x="14" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ROOM RECORD</text>

    <!-- Detail fields -->
    <rect x="14" y="52" width="50" height="6" rx="2" fill="#94a3b8"/>
    <rect x="70" y="52" width="75" height="6" rx="2" fill="#3b82f6"/>

    <rect x="14" y="68" width="40" height="6" rx="2" fill="#94a3b8"/>
    <rect x="70" y="68" width="65" height="6" rx="2" fill="#64748b"/>

    <rect x="14" y="84" width="45" height="6" rx="2" fill="#94a3b8"/>
    <rect x="70" y="84" width="50" height="6" rx="2" fill="#64748b"/>

    <rect x="14" y="100" width="35" height="6" rx="2" fill="#94a3b8"/>
    <rect x="70" y="98" width="45" height="12" rx="6" fill="#d1fae5"/>
    <text x="92" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#065f46" text-anchor="middle">ACTIVE</text>

    <rect x="14" y="122" width="132" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="80" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">ROOM ID QUERY</text>
  </g>

  <!-- Big Stylized Magnifying Glass Overlaid -->
  <g transform="translate(305, 55)" filter="url(#shadowSearch)">
    <!-- Lens Rim -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#2563eb" stroke-width="10"/>
    <!-- Glass with highlight -->
    <circle cx="50" cy="50" r="33" fill="#60a5fa" opacity="0.25"/>
    <path d="M 30 30 Q 50 22 68 32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Glass Center Icon (Search Target) -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="50" y1="36" x2="50" y2="42" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="50" y1="58" x2="50" y2="64" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="36" y1="50" x2="42" y2="50" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="58" y1="50" x2="64" y2="50" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Handle -->
    <line x1="77" y1="77" x2="115" y2="115" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <line x1="77" y1="77" x2="115" y2="115" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
