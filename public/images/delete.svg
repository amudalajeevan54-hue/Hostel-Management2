<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDelete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadowDelete" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="480" height="200" rx="16" fill="url(#bgDelete)" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Left: Room Record Card to be Removed -->
  <g transform="translate(80, 35)" filter="url(#shadowDelete)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#ef4444"/>
    <rect x="0" y="20" width="150" height="8" fill="#ef4444"/>
    <text x="75" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ROOM RECORD</text>

    <!-- Details -->
    <text x="16" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Room ID: 104</text>
    <line x1="16" y1="53" x2="134" y2="53" stroke="#f1f5f9"/>

    <text x="16" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Room No: 28</text>
    <line x1="16" y1="75" x2="134" y2="75" stroke="#f1f5f9"/>

    <text x="16" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Block: Wing B</text>
    <line x1="16" y1="97" x2="134" y2="97" stroke="#f1f5f9"/>

    <rect x="16" y="112" width="118" height="22" rx="4" fill="#fee2e2"/>
    <text x="75" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">PERMANENT REMOVAL</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(250, 95)">
    <path d="M 0 15 L 25 15 M 18 8 L 25 15 L 18 22" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Trash Can / Removal Visual -->
  <g transform="translate(305, 45)" filter="url(#shadowDelete)">
    <!-- Shield / Warning Base -->
    <circle cx="55" cy="65" r="50" fill="#ffffff" stroke="#fee2e2" stroke-width="2"/>
    
    <!-- Trash Can Container -->
    <!-- Lid handle -->
    <rect x="43" y="32" width="24" height="6" rx="3" fill="#dc2626"/>
    <!-- Lid -->
    <rect x="32" y="38" width="46" height="7" rx="2" fill="#ef4444"/>
    <!-- Can Body -->
    <path d="M 36 47 L 40 95 Q 40 99 44 99 L 66 99 Q 70 99 70 95 L 74 47 Z" fill="#dc2626"/>
    <!-- Vertical Grooves -->
    <line x1="47" y1="54" x2="48" y2="91" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="54" x2="55" y2="91" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="63" y1="54" x2="62" y2="91" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
