<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgInsert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadowInsert" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="480" height="200" rx="16" fill="url(#bgInsert)" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Left: Room Form Preview -->
  <g transform="translate(60, 30)" filter="url(#shadowInsert)">
    <rect x="0" y="0" width="170" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#1e40af"/>
    <rect x="0" y="20" width="170" height="10" fill="#1e40af"/>
    <text x="14" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NEW ROOM FORM</text>

    <!-- Form Inputs Mock -->
    <text x="14" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b">ROOM NUMBER</text>
    <rect x="14" y="51" width="142" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#1e40af">101</text>

    <text x="14" y="77" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b">BLOCK NAME</text>
    <rect x="14" y="81" width="142" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#1e40af">Block A</text>

    <text x="14" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b">CAPACITY</text>
    <rect x="14" y="111" width="65" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#1e40af">4 Beds</text>

    <text x="91" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748b">OCCUPIED</text>
    <rect x="91" y="111" width="65" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="97" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#1e40af">0</text>

    <!-- Submit Button Mock -->
    <rect x="14" y="133" width="142" height="18" rx="4" fill="#2563eb"/>
    <text x="85" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Save Room to MySQL</text>
  </g>

  <!-- Center Arrow / Transition -->
  <g transform="translate(245, 95)">
    <circle cx="20" cy="15" r="18" fill="#2563eb" filter="url(#shadowInsert)"/>
    <!-- Plus symbol in center -->
    <line x1="12" y1="15" x2="28" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="7" x2="20" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right: Registered Room Bed Preview -->
  <g transform="translate(300, 45)" filter="url(#shadowInsert)">
    <!-- Room Card -->
    <rect x="0" y="0" width="145" height="130" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="26" rx="8" fill="#10b981"/>
    <rect x="0" y="18" width="145" height="8" fill="#10b981"/>
    <text x="72" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">✓ ALLOCATED ROOM</text>

    <!-- Bed Icon inside card -->
    <g transform="translate(22, 35)">
      <rect x="0" y="8" width="6" height="50" rx="2" fill="#1e40af"/>
      <rect x="85" y="24" width="6" height="34" rx="2" fill="#1e40af"/>
      <rect x="6" y="38" width="79" height="8" rx="2" fill="#3b82f6"/>
      <rect x="18" y="32" width="67" height="10" rx="3" fill="#60a5fa"/>
      <rect x="8" y="28" width="16" height="10" rx="2" fill="#ffffff" stroke="#bfdbfe"/>
    </g>

    <!-- Success Tag -->
    <rect x="18" y="96" width="109" height="20" rx="10" fill="#d1fae5"/>
    <text x="72" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">AVAILABLE FOR ALLOTMENT</text>
  </g>
</svg>
